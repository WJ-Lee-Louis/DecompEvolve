[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "decompevolve"
version = "0.1.0"
description = "Benchmark utilities for optimization reasoning experiments"
requires-python = ">=3.9"
dependencies = ["openai>=2.0,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
gepa = ["gepa==0.1.4"]
modal = ["modal==1.6.4"]

[tool.setuptools.packages.find]
where = ["src"]
