[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "decompevolve"
version = "0.1.0"
description = "Failure-guided prompt evolution for optimization reasoning"
requires-python = ">=3.9"
dependencies = ["openai>=2.0,<3", "python-dotenv>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["src"]
